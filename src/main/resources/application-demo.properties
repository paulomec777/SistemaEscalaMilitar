# Perfil de demonstração: ative com SPRING_PROFILES_ACTIVE=demo
# Usa um banco H2 em memória (não precisa de PostgreSQL nem das variáveis DB_*).
# Os dados são fictícios e voltam ao estado inicial a cada hora (DemoDataLoader).
spring.datasource.url=jdbc:h2:mem:escala;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false

# O DevTools (ativo ao rodar pela IDE) liga o console do H2 sozinho. Isso cria
# um segundo servlet e o Spring Security não consegue decidir as rotas
# ("more than one mappable servlet"). A demo não precisa do console.
spring.h2.console.enabled=false

# O reinício automático do DevTools mantém o H2 vivo na memória e roda o
# carregador da demo de novo, causando "Unique index or primary key violation"
# ao recriar o usuário demo. Na demo, reinicie pelo botão Run da IDE.
spring.devtools.restart.enabled=false
