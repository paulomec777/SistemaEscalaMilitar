# Perfil de demonstração: ative com SPRING_PROFILES_ACTIVE=demo
# Usa um banco H2 em memória (não precisa de PostgreSQL nem das variáveis DB_*).
# Os dados são fictícios e voltam ao estado inicial a cada hora (DemoDataLoader).
spring.datasource.url=jdbc:h2:mem:escala;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
