# Credenciais do banco vêm de variáveis de ambiente (nunca coloque senhas aqui)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
# Não imprime todo SQL no log de produção (polui e pode expor dados)
spring.jpa.show-sql=false
# Consultas só dentro dos services, não durante a renderização da tela
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Porta: usa a variável PORT quando o serviço de hospedagem define uma
server.port=${PORT:8080}

# Vídeo de fundo das telas (ex.: um vídeo gerado no Higgsfield). Vazio = só o gradiente.
# Coloque o arquivo em src/main/resources/static/videos/fundo.mp4 e use APP_VIDEO_FUNDO=/videos/fundo.mp4
# ou aponte para um endereço público: APP_VIDEO_FUNDO=https://.../video.mp4
app.video-fundo=${APP_VIDEO_FUNDO:}

# Painel e mapa abertos sem login (intranet). Se o sistema ficar acessível pela
# internet, use APP_PAINEL_PUBLICO=false para exigir login em tudo.
app.painel-publico=${APP_PAINEL_PUBLICO:true}

# Sessão: cai depois de 30 min parado; cookie inacessível a JavaScript e não enviado por outros sites.
# Em produção com HTTPS (Railway), defina COOKIE_SEGURO=true para o cookie só trafegar criptografado.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SEGURO:false}

# Página de erro própria (templates/error.html), sem detalhes técnicos para o usuário
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never

# Monta a página inteira antes de enviar. Sem isso, em páginas grandes (login) o
# Thymeleaf começa a responder antes de gerar o token CSRF do formulário e dá
# "Cannot create a session after the response has been committed".
spring.thymeleaf.servlet.produce-partial-output-while-processing=false
