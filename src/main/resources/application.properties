# Credenciais do banco vêm de variáveis de ambiente (nunca coloque senhas aqui)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Porta: usa a variável PORT quando o serviço de hospedagem define uma
server.port=${PORT:8080}

# Vídeo de fundo das telas (ex.: um vídeo gerado no Higgsfield).
# Coloque o arquivo em src/main/resources/static/videos/fundo.mp4
# ou aponte para um endereço público: APP_VIDEO_FUNDO=https://.../video.mp4
app.video-fundo=${APP_VIDEO_FUNDO:/videos/fundo.mp4}
