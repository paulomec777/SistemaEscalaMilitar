<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Gerenciar Afastamentos</title>
    <th:block th:replace="~{fragments/layout :: recursos}"></th:block>
</head>
<body>
    <div th:replace="~{fragments/layout :: fundo}"></div>

    <header th:replace="~{fragments/layout :: cabecalho('afastar')}"></header>

    <!-- Conteúdo Principal -->
    <div class="main-container">
        <div th:replace="~{fragments/layout :: mensagens}"></div>
        
        <!-- CARD 1: Formulário de Afastamento -->
        <div class="card" style="max-width: 800px; margin: 0 auto 2rem auto;">
            <div class="card-header">
                <h2>Novo Afastamento / Impedimento</h2>
            </div>
            
           <form th:action="@{/admin/salvar-afastamento}" method="post">
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                    
                    <!-- 1. Militar -->
                    <div class="form-group">
                        <label for="militarId" style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #333;">Militar (Ativo)</label>
                        <select name="militarId" id="militarId" required 
                                style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; background-color: #fff;">
                            <option value="">-- Selecione o Militar --</option>
                            <option th:each="militar : ${listaMilitaresAtivos}"
                                    th:value="${militar.id}"
                                    th:text="${militar.graduacao + ' ' + militar.nomeGuerra}">
                            </option>
                        </select>
                    </div>
                    
                    <!-- 2. Motivo (Texto Livre) -->
                    <div class="form-group">
                        <label for="motivoAfastamento" style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #333;">Motivo / Descrição</label>
                        <input type="text" name="motivoAfastamento" id="motivoAfastamento" required 
                               placeholder="Ex: Atestado Médico, Licença, etc."
                               style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; background-color: #fff;">
                    </div>

                    <!-- 3. Data Início -->
                    <div class="form-group">
                        <label for="dataInicio" style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #333;">Data de Início</label>
                        <input type="date" name="dataInicio" id="dataInicio" required 
                               style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem;">
                    </div>
                    
                    <!-- 4. Data Fim -->
                    <div class="form-group">
                        <label for="dataFim" style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #333;">Data de Término</label>
                        <input type="date" name="dataFim" id="dataFim" required 
                               style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem;">
                    </div>
                
                </div>
                
                <div style="margin-top: 1.5rem; text-align: right;">
                    <a th:href="@{/dashboard}" style="color: #666; text-decoration: none; font-weight: 500; margin-right: 1rem;">Cancelar</a>
                    <button type="submit" class="btn-primary" style="padding: 0.75rem 1.5rem; font-size: 1rem; background-color: #556B2F; border: none; color: white; border-radius: 4px; cursor: pointer;">
                        Confirmar Afastamento
                    </button>
                </div>
            </form>
        </div>
        
        <!-- CARD 2: Tabela de Militares Afastados (Reativar) -->
        <div class="card" style="max-width: 1000px; margin: 0 auto;">
            <div class="card-header">
                <h2>Militares Afastados e Afastamentos Agendados</h2>
            </div>
            
            <table class="escala-table">
                <thead>
                    <tr>
                        <th>Militar</th>
                        <th>Motivo</th>
                        <th>Período</th>
                        <th sec:authorize="hasRole('ADM')" style="text-align: center;">Ação</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="militar : ${listaMilitaresInativos}">
                        
                        <td th:text="${militar.graduacao + ' ' + militar.nomeGuerra}" style="font-weight: 500;"></td>
                        
                        <td>
                            <!-- Exibe dinamicamente o texto livre digitado pelo ADM -->
                            <span th:text="${militar.motivoAfastamento}" 
                                  style="background-color: #FFF3CD; color: #856404; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.9rem; font-weight: 600;">
                            </span>
                        </td>
                        
                        <td>
                            <span th:text="${#temporals.format(militar.dataInicioAfastamento, 'dd/MM/yyyy')}"></span>
                            até
                            <span th:text="${#temporals.format(militar.dataFimAfastamento, 'dd/MM/yyyy')}"></span>
                        </td>
                        
                        <td style="text-align: center;">
                            <form th:action="@{/admin/reativar/{id}(id=${militar.id})}" method="post" style="margin: 0;"
                                  onsubmit="return confirm('Deseja REATIVAR este militar antes do prazo?');">
                                <button type="submit" class="btn-primary"
                                        style="background-color: #28a745; border: none; padding: 0.4rem 0.8rem; font-size: 0.9rem;">
                                    ↺ Reativar
                                </button>
                            </form>
                        </td>
                    </tr>
                    
                    <tr th:if="${#lists.isEmpty(listaMilitaresInativos)}">
                        <td colspan="4" style="text-align: center; padding: 2rem; color: #777;">
                            Nenhum militar afastado no momento.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
    </div>
    <footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
