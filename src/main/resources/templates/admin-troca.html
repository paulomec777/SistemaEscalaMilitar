<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Troca de Serviço</title>
    <th:block th:replace="~{fragments/layout :: recursos}"></th:block>
    <style>
        .troca-lados { display: grid; grid-template-columns: 1fr auto 1fr; gap: 1rem; align-items: stretch; margin-bottom: 1.5rem; }
        @media (max-width: 700px) { .troca-lados { grid-template-columns: 1fr; } .troca-seta { transform: rotate(90deg); justify-self: center; } }
        .troca-lado { display: flex; flex-direction: column; gap: 0.4rem; padding: 1rem 1.1rem; border-radius: 12px; border: 1.5px solid; }
        .troca-lado.sai { border-color: #F3CFCC; background: #FDF6F5; }
        .troca-lado.entra { border-color: #C9E7D2; background: #F3FAF5; }
        .troca-lado strong { font-family: var(--fonte-titulo); font-size: 1.6rem; text-transform: uppercase; color: var(--oliva-800); }
        .troca-lado small { color: var(--texto-suave); font-size: 0.8rem; }
        .troca-seta { align-self: center; font-size: 1.4rem; color: var(--latao); }
        .troca-rotulo { display: block; font-size: 0.75rem !important; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--texto-suave) !important; margin: 0 0 0.35rem !important; }
        .troca-tipos { display: grid; gap: 0.6rem; margin-bottom: 1.25rem; }
        .troca-tipo { display: flex !important; gap: 0.8rem; align-items: flex-start; margin: 0 !important; padding: 0.9rem 1rem; border-radius: 12px;
            border: 1.5px solid #D6D8CC; background: #fff; cursor: pointer; text-transform: none !important; letter-spacing: 0 !important; color: var(--texto) !important; }
        .troca-tipo:hover { border-color: var(--oliva-400); }
        .troca-tipo:has(input:checked) { border-color: var(--oliva-500); background: rgba(85, 107, 47, 0.07); }
        .troca-tipo input { width: 18px !important; height: 18px; margin-top: 0.15rem; accent-color: var(--oliva-500); }
        .troca-tipo strong { display: block; font-size: 1rem; }
        .troca-tipo small { display: block; font-size: 0.86rem; color: var(--texto-suave); line-height: 1.45; margin-top: 0.15rem; font-weight: 400; }
        .troca-nota { font-size: 0.85rem; color: var(--texto-suave); margin: 0 0 1.25rem; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/layout :: fundo}"></div>

    <header th:replace="~{fragments/layout :: cabecalho('troca')}"></header>

    <div class="main-container">
        <div th:replace="~{fragments/layout :: mensagens}"></div>
        
        <div class="card" style="max-width: 860px; margin: 0 auto;">
            <div class="card-header">
                <h2><i class="fas fa-right-left"></i> Troca de Serviço de Hoje</h2>
                <span th:text="${#temporals.format(hoje, 'dd/MM/yyyy')}" style="font-weight: 600; color: var(--texto-suave);">17/11/2026</span>
            </div>

            <!-- Troca bloqueada (fim de semana, feriado ou troca já feita) -->
            <div th:if="${motivoBloqueio != null}" class="flash flash-erro" style="margin-bottom: 0;">
                <i class="fas fa-ban"></i> <span th:text="${motivoBloqueio}">Hoje não tem permanência.</span>
            </div>

            <form th:if="${motivoBloqueio == null}" th:action="@{/admin/salvar-troca}" method="post">
                <!-- Quem sai é sempre o titular de hoje -->
                <input type="hidden" name="militarSaiId" th:value="${titularHoje.id}">

                <div class="troca-lados">
                    <div class="troca-lado sai">
                        <span class="troca-rotulo"><i class="fas fa-arrow-right-from-bracket"></i> Sai do serviço (titular de hoje)</span>
                        <strong th:text="${titularHoje.graduacao + ' ' + titularHoje.nomeGuerra}">3º Sgt Alves</strong>
                        <small th:text="${'Folga atual: ' + titularHoje.folga}">Folga atual: 9</small>
                    </div>
                    <i class="fas fa-right-left troca-seta"></i>
                    <div class="troca-lado entra">
                        <label for="militarEntraId" class="troca-rotulo"><i class="fas fa-arrow-right-to-bracket"></i> Entra no serviço</label>
                        <select id="militarEntraId" name="militarEntraId" required>
                            <option value="">-- Escolha quem assume --</option>
                            <option th:each="militar : ${listaMilitaresAtivos}"
                                    th:value="${militar.id}"
                                    th:text="${militar.graduacao + ' ' + militar.nomeGuerra + ' (folga ' + militar.folga + ')'}">Cb Duarte</option>
                        </select>
                        <small>Só aparece quem pode tirar serviço hoje.</small>
                    </div>
                </div>

                <div class="troca-tipos">
                    <span class="troca-rotulo">Tipo da troca</span>
                    <label th:each="tipo, it : ${tiposTroca}" class="troca-tipo">
                        <input type="radio" name="tipoTroca" th:value="${tipo}" th:checked="${it.first}" required>
                        <span>
                            <strong th:text="${tipo.rotulo}">Missão</strong>
                            <small th:text="${tipo.explicacao}">Explicação</small>
                        </span>
                    </label>
                </div>

                <p class="troca-nota">
                    <i class="fas fa-eye-slash"></i> A troca só aparece para o ADM. No painel e no mapa a tropa vê apenas quem está de serviço.
                </p>

                <div style="display: flex; justify-content: flex-end; gap: 1rem; align-items: center; border-top: 1px solid var(--borda); padding-top: 1.25rem;">
                    <a th:href="@{/dashboard}" style="color: var(--texto-suave); text-decoration: none; font-weight: 500;">Cancelar</a>
                    <button type="submit" class="btn-primary"
                            onclick="return confirm('Confirmar a troca do serviço de hoje? Só é possível uma troca por dia.');">
                        <i class="fas fa-check"></i> Confirmar troca
                    </button>
                </div>
            </form>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
