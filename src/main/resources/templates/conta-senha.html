<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha senha - Escala de Serviço</title>
    <th:block th:replace="~{fragments/layout :: recursos}"></th:block>
</head>
<body>
    <div th:replace="~{fragments/layout :: fundo}"></div>
    <header th:replace="~{fragments/layout :: cabecalho('senha')}"></header>

    <main class="main-container" style="max-width: 560px;">
        <div th:replace="~{fragments/layout :: mensagens}"></div>

        <section class="card">
            <div class="card-header">
                <h2><i class="fas fa-key"></i> Minha senha</h2>
                <span style="font-size: 0.85rem; color: var(--texto-suave);" sec:authentication="name">demo</span>
            </div>
            <form th:action="@{/conta/senha}" method="post">
                <div class="form-group">
                    <label for="senhaAtual">Senha atual</label>
                    <input type="password" id="senhaAtual" name="senhaAtual" autocomplete="current-password" required>
                </div>
                <div class="form-group">
                    <label for="novaSenha">Nova senha</label>
                    <input type="password" id="novaSenha" name="novaSenha" autocomplete="new-password" minlength="8" maxlength="72" required>
                </div>
                <div class="form-group">
                    <label for="confirmacao">Repita a nova senha</label>
                    <input type="password" id="confirmacao" name="confirmacao" autocomplete="new-password" minlength="8" maxlength="72" required>
                </div>
                <p style="font-size: 0.85rem; color: var(--texto-suave); margin: 0 0 1rem;">
                    Mínimo de 8 caracteres. Use letras e números e não repita a senha antiga.
                </p>
                <button type="submit" class="btn-primary"><i class="fas fa-floppy-disk"></i> Salvar nova senha</button>
            </form>
        </section>
    </main>

    <footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
