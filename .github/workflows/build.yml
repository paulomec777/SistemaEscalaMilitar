name: Build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar, rodar os testes e empacotar
        run: mvn -B package

  demo:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Subir a demo e testar
        env:
          SPRING_PROFILES_ACTIVE: demo
        run: |
          mvn -B -q -DskipTests package
          java -jar target/*.jar > app.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://localhost:8080/login > login.html && break; sleep 3; done
          grep -q "Versão de demonstração" login.html
          curl -sf http://localhost:8080/dashboard > dashboard.html
          grep -qE "Alves|Barros|Cardoso" dashboard.html
          # Login com o token CSRF (proteção ligada)
          token() { grep -o 'name="_csrf" value="[^"]*"' "$1" | head -1 | sed 's/.*value="//;s/"$//'; }
          curl -sf -c cookies.txt -b cookies.txt http://localhost:8080/login > login.html
          curl -s -c cookies.txt -b cookies.txt -o /dev/null -w "%{redirect_url}\n" \
               --data-urlencode "username=demo" --data-urlencode "password=demo" --data-urlencode "_csrf=$(token login.html)" \
               http://localhost:8080/login | grep -q dashboard
          grep -q "Avisos da semana" dashboard.html
          grep -q "Missão de última hora" dashboard.html
          curl -sf "http://localhost:8080/mapa" > mapa.html
          grep -q "Escolta de material" mapa.html
          curl -sf "http://localhost:8080/mapa?semana=1" > /dev/null
          curl -sf "http://localhost:8080/mapa?semana=-1" > /dev/null
          for pagina in admin/missoes admin/avisos admin/troca admin/afastar admin/controle admin/feriados admin/usuarios admin/novo-militar; do
            curl -sf -b cookies.txt "http://localhost:8080/$pagina" > pagina.html || { echo "Falhou: /$pagina"; exit 1; }
            grep -q "Gestão" pagina.html || { echo "Sem menu: /$pagina"; exit 1; }
          done
          # POST sem token CSRF tem que ser recusado
          codigo=$(curl -s -b cookies.txt -o /dev/null -w "%{http_code}" -d "titulo=Ataque" http://localhost:8080/admin/avisos/salvar)
          [ "$codigo" = "403" ] || { echo "POST sem CSRF deveria dar 403, deu $codigo"; exit 1; }
          # POST com token funciona
          curl -sf -b cookies.txt http://localhost:8080/admin/avisos > avisos.html
          curl -sf -b cookies.txt -o /dev/null --data-urlencode "titulo=Teste CI" --data-urlencode "prioridade=URGENTE" \
               --data-urlencode "_csrf=$(token avisos.html)" http://localhost:8080/admin/avisos/salvar
          curl -sf "http://localhost:8080/dashboard" | grep -q "Teste CI"
          # Página de erro própria
          curl -s -b cookies.txt "http://localhost:8080/nao-existe" | grep -q "Página não encontrada"
      - name: Log da aplicação
        if: always()
        run: cat app.log || true
