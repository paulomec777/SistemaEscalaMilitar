name: Build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar e empacotar
        run: mvn -B -DskipTests package

  demo:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Subir a demo e testar
        env:
          SPRING_PROFILES_ACTIVE: demo
        run: |
          mvn -B -q -DskipTests package
          java -jar target/*.jar > app.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://localhost:8080/login > login.html && break; sleep 3; done
          grep -q "Versão de demonstração" login.html
          curl -sf http://localhost:8080/dashboard > dashboard.html
          grep -qE "Alves|Barros|Cardoso" dashboard.html
          curl -s -c cookies.txt -o /dev/null -w "%{redirect_url}\n" -d "username=demo&password=demo" http://localhost:8080/login | grep -q dashboard
      - name: Log da aplicação
        if: always()
        run: cat app.log || true
